[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-banking-agent"
version = "0.1.0"
description = "Fail-closed orchestration core for a bank-integrated conversational agent"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["banking_agent"]

[tool.setuptools.package-data]
banking_agent = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
