<text x="972" y="765" font-size="21" fill="#30283f" font-weight="700">AuditLog / privacy</text>
<text x="972" y="795" font-size="16" fill="#646078" font-weight="400">执行前审计 · 追加 JSONL</text>
<text x="972" y="820" font-size="16" fill="#646078" font-weight="400">标识 HMAC · SHA-256 日志链</text>
<polyline points="472,660 472,730" fill="none" stroke="#8c86a6" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1150,660 1150,730" fill="none" stroke="#8c86a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="920" width="850" height="90" rx="18" fill="#ffffff" stroke="#ddd8ed" stroke-width="1.5"/>
<text x="70" y="955" font-size="21" fill="#30283f" font-weight="700">每轮会话的内存数据</text>
<text x="70" y="985" font-size="16" fill="#646078" font-weight="400">账户、联系人、任务、持仓、计划、幂等结果；重置或重启恢复样例</text>
<rect x="950" y="920" width="402" height="90" rx="18" fill="#ffffff" stroke="#ddd8ed" stroke-width="1.5"/>
<text x="972" y="955" font-size="21" fill="#30283f" font-weight="700">本地磁盘</text>
<text x="972" y="985" font-size="16" fill="#646078" font-weight="400">data/*.jsonl；不用于恢复业务状态</text>
<polyline points="472,855 472,920" fill="none" stroke="#8c86a6" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1150,855 1150,920" fill="none" stroke="#8c86a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="1048" font-size="17" fill="#646078" font-weight="400">全部数据为虚构样例 · 没有真实银行 / LLM / 数据库 / 后台调度 · 此图不是独立微服务部署图</text>
</g>
</svg>
